<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Campus Events</title>
<style>
  :root {
    --bg: #0f0d0b;
    --panel: #17140f;
    --panel-2: #1e1a13;
    --border: #3d3222;
    --border-soft: #2a231a;
    --accent: #f0a030;
    --accent-dim: #c07d1f;
    --text: #f5f0e6;
    --text-dim: #96897a;
    --danger: #e5564a;
    --success: #6fbf7a;
    --waitlist: #e5c04a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased;
  }
  .app-shell { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }

  .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 3px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .brand-name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
  .role-badge { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; background: var(--panel-2); color: var(--accent); border: 1px solid var(--border); margin-left: 8px; }

  .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border-soft); margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 4px; margin-right: 20px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); cursor: pointer; user-select: none; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab.hidden { display: none; }

  .card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 4px; padding: 18px; margin-bottom: 14px; }
  .card-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 14px 0; border-bottom: 1px solid var(--border-soft); padding-bottom: 10px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-family: inherit; font-size: 14px;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  label { font-size: 11px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 5px; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em;
    background: var(--accent); color: #14100a; border: none; padding: 11px 18px; border-radius: 4px; cursor: pointer;
    transition: background 0.12s ease;
  }
  button:hover { background: var(--accent-dim); }
  button.secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--border); font-weight: 700; padding: 8px 14px; }
  button.secondary:hover { background: var(--panel-2); color: var(--text); }
  button.danger { background: var(--danger); color: white; }
  button.block { width: 100%; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 12px; padding: 10px 12px; background: rgba(229,86,74,0.08); border-left: 3px solid var(--danger); }
  .success-msg { color: var(--success); font-size: 13px; margin-bottom: 12px; padding: 10px 12px; background: rgba(111,191,122,0.08); border-left: 3px solid var(--success); }
  .hidden { display: none !important; }

  .auth-wrap { max-width: 400px; margin: 40px auto 0; }
  .auth-title { text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .auth-sub { text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }
  .role-select { display: flex; gap: 8px; margin-bottom: 12px; }
  .role-option {
    flex: 1; padding: 10px; text-align: center; border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-dim);
  }
  .role-option.selected { border-color: var(--accent); color: var(--accent); background: rgba(240,160,48,0.08); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-row select, .filter-row input { width: auto; flex: 1; min-width: 130px; margin-bottom: 0; }

  .event-card { background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 4px; padding: 16px; margin-bottom: 12px; }
  .event-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .event-title { font-weight: 800; font-size: 15px; }
  .event-organizer { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .event-desc { color: var(--text-dim); font-size: 12.5px; margin-top: 8px; line-height: 1.5; }
  .event-meta-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .meta-chip { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 3px; background: var(--panel); color: var(--text-dim); border: 1px solid var(--border-soft); }
  .meta-chip.category { color: var(--accent); }
  .capacity-chip.full { color: var(--danger); }
  .capacity-chip.ok { color: var(--success); }
  .event-actions { display: flex; gap: 8px; margin-top: 12px; }
  .status-pill { font-size: 10.5px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 3px; }
  .status-pill.going { background: rgba(111,191,122,0.15); color: var(--success); }
  .status-pill.waitlisted { background: rgba(229,192,74,0.15); color: var(--waitlist); }

  .empty-state { color: var(--text-dim); font-size: 13px; text-align: center; padding: 30px 0; }
  .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>
<div class="app-shell">

  <div id="authView">
    <div class="auth-wrap">
      <div class="auth-title">🎓 CAMPUS EVENTS</div>
      <div class="auth-sub">Find events. RSVP. Never miss a club meeting.</div>

      <div class="card" id="loginCard">
        <div id="loginError" class="error hidden"></div>
        <label>Username</label>
        <input id="loginUsername" placeholder="e.g. david" />
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Your password" />
        <button class="block" onclick="handleLogin()">Log In</button>
        <div style="height:8px"></div>
        <button class="block secondary" onclick="showRegister()">Create Account</button>
      </div>

      <div class="card hidden" id="registerCard">
        <div id="registerError" class="error hidden"></div>
        <label>I am a...</label>
        <div class="role-select">
          <div class="role-option selected" id="roleStudentBtn" onclick="selectRole('STUDENT')">Student</div>
          <div class="role-option" id="roleOrganizerBtn" onclick="selectRole('ORGANIZER')">Organizer</div>
        </div>
        <label>Username</label>
        <input id="regUsername" placeholder="e.g. david" />
        <label>Email</label>
        <input id="regEmail" type="email" placeholder="you@ecu.edu" />
        <label>Password</label>
        <input id="regPassword" type="password" placeholder="At least 6 characters" />
        <button class="block" onclick="handleRegister()">Create Account</button>
        <div style="height:8px"></div>
        <button class="block secondary" onclick="showLogin()">Back to Log In</button>
      </div>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="top-header">
      <div class="brand">
        <div class="brand-mark">🎓</div>
        <div class="brand-name">Campus Events</div>
        <span class="role-badge" id="roleBadge"></span>
      </div>
      <button class="secondary" onclick="logout()">Log Out</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="browse" onclick="switchTab('browse')">Browse</div>
      <div class="tab" data-tab="myrsvps" onclick="switchTab('myrsvps')">My Events</div>
      <div class="tab hidden" id="createTab" data-tab="create" onclick="switchTab('create')">Create Event</div>
      <div class="tab hidden" id="manageTab" data-tab="manage" onclick="switchTab('manage')">Manage My Events</div>
    </div>

    <div id="tab-browse">
      <div class="card">
        <div class="filter-row">
          <input id="searchInput" placeholder="Search events..." oninput="debouncedBrowse()" />
          <select id="categoryFilter" onchange="loadBrowseEvents(0)">
            <option value="">All categories</option>
            <option value="CLUB_MEETING">Club Meeting</option>
            <option value="STUDY_GROUP">Study Group</option>
            <option value="WORKSHOP">Workshop</option>
            <option value="SOCIAL">Social</option>
            <option value="SPORTS">Sports</option>
            <option value="CAREER">Career</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
        <div id="browseList"></div>
        <div class="pagination" id="browsePagination"></div>
      </div>
    </div>

    <div id="tab-myrsvps" class="hidden">
      <div class="card">
        <div class="card-title">Events You're Attending</div>
        <div id="myRsvpsList"></div>
      </div>
    </div>

    <div id="tab-create" class="hidden">
      <div class="card">
        <div class="card-title" id="createFormTitle">Create Event</div>
        <div id="createError" class="error hidden"></div>
        <input type="hidden" id="editingEventId" />
        <label>Title</label>
        <input id="eventTitle" placeholder="e.g. Weekly Coding Club Meetup" />
        <label>Description</label>
        <textarea id="eventDescription" rows="3" placeholder="What's this event about?"></textarea>
        <div class="row">
          <div>
            <label>Category</label>
            <select id="eventCategory">
              <option value="CLUB_MEETING">Club Meeting</option>
              <option value="STUDY_GROUP">Study Group</option>
              <option value="WORKSHOP">Workshop</option>
              <option value="SOCIAL">Social</option>
              <option value="SPORTS">Sports</option>
              <option value="CAREER">Career</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
          <div>
            <label>Capacity</label>
            <input id="eventCapacity" type="number" placeholder="30" />
          </div>
        </div>
        <label>Location</label>
        <input id="eventLocation" placeholder="e.g. Science Building Room 204" />
        <label>Start Time</label>
        <input id="eventStartTime" type="datetime-local" />
        <button class="block" id="createEventBtn" onclick="submitEvent()">Create Event</button>
      </div>
    </div>

    <div id="tab-manage" class="hidden">
      <div class="card">
        <div class="card-title">Events You Organize</div>
        <div id="manageList"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8080/api";
let token = localStorage.getItem("token");
let currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
let selectedRegisterRole = "STUDENT";
let browsePage = 0;

const CATEGORY_LABELS = {
  CLUB_MEETING: "Club Meeting", STUDY_GROUP: "Study Group", WORKSHOP: "Workshop",
  SOCIAL: "Social", SPORTS: "Sports", CAREER: "Career", OTHER: "Other"
};

function showError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.classList.remove("hidden");
}
function hideError(elId) {
  document.getElementById(elId).classList.add("hidden");
}

function showLogin() {
  document.getElementById("loginCard").classList.remove("hidden");
  document.getElementById("registerCard").classList.add("hidden");
}
function showRegister() {
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("registerCard").classList.remove("hidden");
}
function selectRole(role) {
  selectedRegisterRole = role;
  document.getElementById("roleStudentBtn").classList.toggle("selected", role === "STUDENT");
  document.getElementById("roleOrganizerBtn").classList.toggle("selected", role === "ORGANIZER");
}

async function handleRegister() {
  hideError("registerError");
  const body = {
    username: document.getElementById("regUsername").value.trim(),
    email: document.getElementById("regEmail").value.trim(),
    password: document.getElementById("regPassword").value,
    role: selectedRegisterRole,
  };
  try {
    const res = await fetch(`${API_BASE}/auth/register`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = data.error || Object.values(data)[0] || "Registration failed";
      showError("registerError", msg);
      return;
    }
    onAuthSuccess(data);
  } catch (err) {
    showError("registerError", "Could not reach the server. Is the Spring Boot backend running on port 8080?");
  }
}

async function handleLogin() {
  hideError("loginError");
  const body = {
    username: document.getElementById("loginUsername").value.trim(),
    password: document.getElementById("loginPassword").value,
  };
  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      showError("loginError", data.error || "Login failed");
      return;
    }
    onAuthSuccess(data);
  } catch (err) {
    showError("loginError", "Could not reach the server. Is the Spring Boot backend running on port 8080?");
  }
}

function onAuthSuccess(data) {
  token = data.token;
  currentUser = { id: data.userId, username: data.username, role: data.role };
  localStorage.setItem("token", token);
  localStorage.setItem("currentUser", JSON.stringify(currentUser));
  showApp();
}

function logout() {
  token = null;
  currentUser = null;
  localStorage.removeItem("token");
  localStorage.removeItem("currentUser");
  document.getElementById("appView").classList.add("hidden");
  document.getElementById("authView").classList.remove("hidden");
  showLogin();
}

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { "Content-Type": "application/json", ...(token ? { "Authorization": `Bearer ${token}` } : {}), ...(options.headers || {}) },
  });
  if (res.status === 401) { logout(); throw new Error("Session expired"); }
  if (res.status === 204) return null;
  return res.json();
}

function showApp() {
  document.getElementById("authView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  document.getElementById("roleBadge").textContent = currentUser.role;

  const isOrganizer = currentUser.role === "ORGANIZER";
  document.getElementById("createTab").classList.toggle("hidden", !isOrganizer);
  document.getElementById("manageTab").classList.toggle("hidden", !isOrganizer);

  loadBrowseEvents(0);
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  ["browse", "myrsvps", "create", "manage"].forEach(t => {
    const el = document.getElementById(`tab-${t}`);
    if (el) el.classList.toggle("hidden", t !== name);
  });
  if (name === "myrsvps") loadMyRsvps();
  if (name === "manage") loadManageEvents();
  if (name === "create") resetCreateForm();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function formatDateTime(iso) {
  return new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

let searchDebounce = null;
function debouncedBrowse() {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => loadBrowseEvents(0), 300);
}

async function loadBrowseEvents(page) {
  browsePage = page;
  const category = document.getElementById("categoryFilter").value;
  const search = document.getElementById("searchInput").value.trim();
  const params = new URLSearchParams({ page, size: 10 });
  if (category) params.set("category", category);
  if (search) params.set("search", search);

  try {
    const data = await apiFetch(`/events?${params.toString()}`);
    renderEventList(data.content, "browseList", { showRsvp: true });
    renderPagination(data, "browsePagination", loadBrowseEvents);
  } catch (err) {
    document.getElementById("browseList").innerHTML = `<div class="empty-state">Could not load events. Is the backend running?</div>`;
  }
}

function renderPagination(page, elId, loadFn) {
  const el = document.getElementById(elId);
  if (page.totalPages <= 1) { el.innerHTML = ""; return; }
  let html = "";
  for (let i = 0; i < page.totalPages; i++) {
    html += `<button class="${i === page.number ? '' : 'secondary'}" onclick="${loadFn.name}(${i})">${i + 1}</button>`;
  }
  el.innerHTML = html;
}

function renderEventList(events, elId, opts) {
  const el = document.getElementById(elId);
  if (!events || events.length === 0) {
    el.innerHTML = `<div class="empty-state">No events found.</div>`;
    return;
  }
  el.innerHTML = events.map(e => eventCardHtml(e, opts)).join("");
}

function eventCardHtml(e, opts) {
  const capacityClass = e.isFull ? "full" : "ok";
  const capacityText = e.isFull ? `Full (${e.goingCount}/${e.capacity})` : `${e.goingCount}/${e.capacity} going`;

  let actionHtml = "";
  if (opts.showRsvp) {
    if (e.myRsvpStatus === "GOING") {
      actionHtml = `<span class="status-pill going">Going</span> <button class="secondary" onclick="cancelRsvp(${e.id})">Cancel</button>`;
    } else if (e.myRsvpStatus === "WAITLISTED") {
      actionHtml = `<span class="status-pill waitlisted">Waitlisted</span> <button class="secondary" onclick="cancelRsvp(${e.id})">Leave Waitlist</button>`;
    } else {
      actionHtml = `<button onclick="joinEvent(${e.id})">${e.isFull ? "Join Waitlist" : "RSVP"}</button>`;
    }
  }

  let manageHtml = "";
  if (opts.showManage) {
    manageHtml = `
      <button class="secondary" onclick="startEditEvent(${e.id})">Edit</button>
      <button class="danger" onclick="deleteEvent(${e.id})">Delete</button>
    `;
  }

  return `
    <div class="event-card">
      <div class="event-top">
        <div>
          <div class="event-title">${escapeHtml(e.title)}</div>
          <div class="event-organizer">Organized by ${escapeHtml(e.organizerUsername)}</div>
        </div>
      </div>
      ${e.description ? `<div class="event-desc">${escapeHtml(e.description)}</div>` : ""}
      <div class="event-meta-row">
        <span class="meta-chip category">${CATEGORY_LABELS[e.category] || e.category}</span>
        <span class="meta-chip">${escapeHtml(e.location)}</span>
        <span class="meta-chip">${formatDateTime(e.startTime)}</span>
        <span class="meta-chip capacity-chip ${capacityClass}">${capacityText}</span>
        ${e.waitlistCount > 0 ? `<span class="meta-chip">${e.waitlistCount} waitlisted</span>` : ""}
      </div>
      <div class="event-actions">${actionHtml}${manageHtml}</div>
    </div>
  `;
}

async function joinEvent(eventId) {
  try {
    await apiFetch(`/events/${eventId}/rsvp`, { method: "POST" });
    loadBrowseEvents(browsePage);
  } catch (err) {
    alert("Could not RSVP: " + err.message);
  }
}

async function cancelRsvp(eventId) {
  try {
    await apiFetch(`/events/${eventId}/rsvp`, { method: "DELETE" });
    loadBrowseEvents(browsePage);
    loadMyRsvps();
  } catch (err) {
    alert("Could not cancel RSVP: " + err.message);
  }
}

async function loadMyRsvps() {
  try {
    const events = await apiFetch("/my-rsvps");
    renderEventList(events, "myRsvpsList", { showRsvp: true });
  } catch (err) {
    document.getElementById("myRsvpsList").innerHTML = `<div class="empty-state">Could not load your events.</div>`;
  }
}

function resetCreateForm() {
  document.getElementById("editingEventId").value = "";
  document.getElementById("createFormTitle").textContent = "Create Event";
  document.getElementById("createEventBtn").textContent = "Create Event";
  document.getElementById("eventTitle").value = "";
  document.getElementById("eventDescription").value = "";
  document.getElementById("eventCategory").value = "CLUB_MEETING";
  document.getElementById("eventCapacity").value = "";
  document.getElementById("eventLocation").value = "";
  document.getElementById("eventStartTime").value = "";
  hideError("createError");
}

async function submitEvent() {
  hideError("createError");
  const editingId = document.getElementById("editingEventId").value;
  const body = {
    title: document.getElementById("eventTitle").value.trim(),
    description: document.getElementById("eventDescription").value.trim(),
    category: document.getElementById("eventCategory").value,
    capacity: parseInt(document.getElementById("eventCapacity").value, 10),
    location: document.getElementById("eventLocation").value.trim(),
    startTime: document.getElementById("eventStartTime").value,
  };

  try {
    if (editingId) {
      await apiFetch(`/events/${editingId}`, { method: "PUT", body: JSON.stringify(body) });
    } else {
      await apiFetch("/events", { method: "POST", body: JSON.stringify(body) });
    }
    resetCreateForm();
    switchTab("manage");
  } catch (err) {
    showError("createError", "Could not save event. Check all fields are filled in correctly (start time must be in the future).");
  }
}

async function startEditEvent(eventId) {
  const event = await apiFetch(`/events/${eventId}`);
  document.getElementById("editingEventId").value = event.id;
  document.getElementById("createFormTitle").textContent = "Edit Event";
  document.getElementById("createEventBtn").textContent = "Save Changes";
  document.getElementById("eventTitle").value = event.title;
  document.getElementById("eventDescription").value = event.description || "";
  document.getElementById("eventCategory").value = event.category;
  document.getElementById("eventCapacity").value = event.capacity;
  document.getElementById("eventLocation").value = event.location;
  document.getElementById("eventStartTime").value = event.startTime.slice(0, 16);
  switchTab("create");
}

async function deleteEvent(eventId) {
  if (!confirm("Delete this event? This cannot be undone.")) return;
  try {
    await apiFetch(`/events/${eventId}`, { method: "DELETE" });
    loadManageEvents();
  } catch (err) {
    alert("Could not delete event: " + err.message);
  }
}

async function loadManageEvents() {
  try {
    const data = await apiFetch("/events/mine?size=50");
    renderEventList(data.content, "manageList", { showManage: true });
  } catch (err) {
    document.getElementById("manageList").innerHTML = `<div class="empty-state">Could not load your events.</div>`;
  }
}

if (token && currentUser) {
  showApp();
}
</script>
</body>
</html>
