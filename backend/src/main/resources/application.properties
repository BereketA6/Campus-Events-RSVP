# Server
server.port=8080

# H2 file-based database — creates campus_events.mv.db in the backend folder on first run.
# No separate database install needed.
spring.datasource.url=jdbc:h2:file:./campus_events;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create/update tables from the @Entity classes. Fine for a learning
# project; a production app would use versioned migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2's web console, handy for peeking at the database directly in a browser
# at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./campus_events)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT — in a real production app this secret would come from an environment
# variable, never committed to source control. Kept simple here for learning.
app.jwt.secret=dev-secret-key-change-this-in-production-please-make-it-long-enough-for-hs256
app.jwt.expiration-ms=86400000
